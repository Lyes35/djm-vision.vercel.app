name: NodeJS with Webpack

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [18.x, 20.x, 22.x]

    steps:
    - uses: actions/checkout@v4

    - name: Use Node.js ${{ matrix.node-version }}
      uses: actions/setup-node@v4
      with:
        node-version: ${{ matrix.node-version }}

    - name: Install dependencies
      run: npm ci

    - name: Build
      run: npx webpack

    - name: Start dev proxy
      run: |
        npm run proxy &
        echo $! > proxy.pid
        # wait for proxy to be ready (increased to reduce flakiness)
        sleep 3

    - name: Run stream tests
      env:
        PROXY_PORT: 3001
      run: npm run test:streams

    - name: Stop dev proxy
      run: |
        if [ -f proxy.pid ]; then
          PID=$(cat proxy.pid)
          kill $PID || true
          rm -f proxy.pid
        fi
